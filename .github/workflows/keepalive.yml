name: keepalive-supabase

# Mantém o projeto Supabase ativo — o plano free pausa após ~7 dias sem requisições.
# Roda a cada 3 dias e também pode ser disparado manualmente na aba Actions.

on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          URL="https://exfurpojaaqpwmgxsirg.supabase.co/rest/v1/fazendas?select=id&limit=1"
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4ZnVycG9qYWFxcHdtZ3hzaXJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NDkzODEsImV4cCI6MjEwMTUyNTM4MX0.kStuq6RkAkKfDDvGVs63Q3gMLAi0o2MfTm1aQ_FQleo"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL" -H "apikey: $KEY")
          echo "HTTP $CODE"
          case "$CODE" in
            2*) echo "Projeto ativo." ;;
            *) echo "Resposta inesperada ($CODE) — verifique o projeto no dashboard do Supabase."; exit 1 ;;
          esac
